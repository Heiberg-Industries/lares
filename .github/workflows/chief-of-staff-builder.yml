name: chief-of-staff builder image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["scripts/scan-image.sh", "services/chief-of-staff/**", "packages/**", "patches/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", ".github/workflows/chief-of-staff-builder.yml", "services/network/**", "images/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact manually selected ref
        type: boolean
        default: false
permissions: { contents: read, packages: write }
env:
  EVE_TELEMETRY_DISABLED: "1"
jobs:
  build:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heiberg-industries/lares-chief-of-staff
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build final image for security evidence
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/chief-of-staff/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: lares-chief-of-staff-builder:test
      - name: Scan final image
        env:
          LARES_SCAN_BUILD_IMAGE: "1"
        run: scripts/scan-image.sh lares-chief-of-staff-builder:test "$RUNNER_TEMP/image-scans/chief-of-staff-builder"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chief-of-staff-builder-image-scan
          path: ${{ runner.temp }}/image-scans
          if-no-files-found: error
      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/chief-of-staff/Dockerfile
          push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}"
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
      - name: Publish digest to job summary
        run: |
          echo "## chief-of-staff-builder image build" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Build digest (a build-only run does not publish it):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/heiberg-industries/lares-chief-of-staff@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
