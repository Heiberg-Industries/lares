name: keeper and neutral runtime images
on:
  push:
    branches: [main]
    paths: ['services/**', 'packages/**', 'images/**', 'patches/**', 'docs/**', 'releases/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'scripts/scan-image.sh', 'scripts/public-docs.ts', '.github/workflows/keeper-runtime-images.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact manually selected ref
        type: boolean
        default: false
      docs_release:
        description: Public docs identity (candidate, or the exact release ID whose source is this ref)
        type: string
        default: candidate
permissions: {contents: read, packages: write}
env:
  EVE_TELEMETRY_DISABLED: "1"
jobs:
  runtime:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_DOCS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.docs_release || 'candidate' }}
    strategy:
      max-parallel: 1
      matrix:
        role: [chief-of-staff, creative]
    steps:
      - uses: actions/checkout@v4
      # The snapshot is exported from this exact checkout before either role image is built.
      # Numbered release identity is an explicit dispatch input; ordinary branch builds remain candidates.
      - name: Enable corepack and prepare pnpm 9.15.0
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install the exporter and role dependency closures
        run: pnpm install --frozen-lockfile --filter lares --filter "lares-${{ matrix.role }}..." --filter "@lares/keeper..."
      - name: Check first-use config and Docker commands offline
        if: matrix.role == 'chief-of-staff'
        run: python3 -B services/keeper/tests/native-first-use-command.test.py
      - name: Export and stage the verified public docs corpus
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export_dir="$RUNNER_TEMP/public-docs-corpus"
          node --import tsx scripts/public-docs.ts export --root "$GITHUB_WORKSPACE" --release "$PUBLIC_DOCS_RELEASE" --out "$export_dir" > "$RUNNER_TEMP/public-docs-identity.json"
          mkdir -p .public-docs-bake
          cp -R "$export_dir" .public-docs-bake/snapshot
          cp "$RUNNER_TEMP/public-docs-identity.json" .public-docs-bake/identity.json
          expected_hash="$(node -e 'const i=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if(i.sourceCommit!==process.argv[2]||i.release!==process.argv[3]) process.exit(1); process.stdout.write(i.corpusSha256)' "$RUNNER_TEMP/public-docs-identity.json" "$GITHUB_SHA" "$PUBLIC_DOCS_RELEASE")"
          node --import tsx scripts/public-docs.ts verify --snapshot "$GITHUB_WORKSPACE/.public-docs-bake/snapshot" --expected-corpus "$expected_hash"
      - uses: docker/setup-buildx-action@v3
      - name: Prove protected gateway authority staging and resolved Compose mount isolation
        if: matrix.role == 'chief-of-staff'
        run: |
          set -euo pipefail
          docker compose version
          sudo env "PATH=$PATH" "$GITHUB_WORKSPACE/node_modules/.bin/tsx" services/box/tests/gateway-authority-stage-image.probe.ts
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.role }}/Dockerfile
          target: runtime
          pull: true
          load: true
          tags: lares-runtime:test
      - name: Scan final runtime image
        run: scripts/scan-image.sh lares-runtime:test "$RUNNER_TEMP/image-scans/runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.role }}-image-scan
          path: ${{ runner.temp }}/image-scans
          if-no-files-found: error
      - name: Verify compiled executable and unprivileged runtime
        run: |
          docker run --rm --network none --entrypoint sh lares-runtime:test -c 'test "$(id -u)" = 10001 && test -f .output/server/index.mjs && test -x ./node_modules/.bin/eve && ! command -v npm && ! command -v corepack && ./node_modules/.bin/eve --version'
      - name: Exercise the pinned Eve production handoff cases
        run: sudo env CI=true node services/keeper/tests/eve-startup-admission.test.mjs "${{ matrix.role }}"
      - name: Prove generated role startup admission in the actual Linux image
        run: sudo env CI=true python3 -B services/keeper/tests/role-start-admission-image.probe.py "${{ matrix.role }}" lares-runtime:test "$GITHUB_SHA" "$RUNNER_TEMP/role-start-admission-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-start-admission-${{ matrix.role }}-proof
          path: ${{ runner.temp }}/role-start-admission-proof.json
          if-no-files-found: error
      - name: Verify the baked public docs corpus in the final role image
        run: python3 -B services/keeper/tests/public-docs-image.probe.py "${{ matrix.role }}" lares-runtime:test "$GITHUB_SHA" "$PUBLIC_DOCS_RELEASE" "$RUNNER_TEMP/public-docs-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-docs-${{ matrix.role }}-image-proof
          path: ${{ runner.temp }}/public-docs-proof.json
          if-no-files-found: error
      - name: Exercise compiled runtime, mounted persona and gateway selection across restart
        if: matrix.role == 'chief-of-staff'
        run: sudo env CI=true python3 -B services/keeper/tests/runtime-image.probe.py lares-runtime:test
      - name: Prove guarded gateway ingress and physical dispatch in pinned upstream image
        if: matrix.role == 'chief-of-staff'
        run: sudo env CI=true HOME="$HOME" PATH="$PATH" python3 -B services/keeper/tests/gateway-admission-image.probe.py lares-runtime:test "$RUNNER_TEMP/gateway-admission-proof.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.role == 'chief-of-staff'
        with:
          name: gateway-admission-compatibility-proof
          path: ${{ runner.temp }}/gateway-admission-proof.json
          if-no-files-found: error
      - name: Build the matching Keeper image for the combined first-use proof
        if: matrix.role == 'chief-of-staff'
        run: docker buildx build --pull --load --file services/keeper/Dockerfile --tag lares-keeper:combined .
      - name: Prove first native activation through compiled Eve and production Keeper
        if: matrix.role == 'chief-of-staff'
        run: sudo env CI=true python3 -B services/keeper/tests/native-first-use-image.probe.py lares-runtime:test lares-keeper:combined "$GITHUB_SHA" "$RUNNER_TEMP/native-first-use-proof.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.role == 'chief-of-staff'
        with:
          name: native-first-use-proof
          path: ${{ runner.temp }}/native-first-use-proof.json
          if-no-files-found: error
      # creative carries a `tests/agent-declaration.test.ts`
      # framework_tools/tool-truth block that is `skipIf` on a compiled manifest under a
      # gitignored `.output/` — the ONE thing that can prove a disable-sentinel or a
      # build-time-disabled extension tool didn't silently drift from the persona's "where I
      # run" section (see packages/agent-kit/src/persona/deployed-tools.ts's header: filesystem
      # naming is cheap but naive; the compiled manifest is authoritative). No workflow ever ran
      # them, so they only ever checked anything on someone's own machine. chief-of-staff has no
      # such file: its tool-truth check (tests/instructions.test.ts) already runs entirely off
      # source via `deployedToolsFor`, so nothing to extract there.
      - name: Extract the compiled agent manifest
        if: matrix.role != 'chief-of-staff'
        run: |
          set -euo pipefail
          id=$(docker create lares-runtime:test)
          trap 'docker rm "$id" >/dev/null' EXIT
          mkdir -p "services/${{ matrix.role }}/.output/.eve/compile"
          docker cp "$id:/app/services/${{ matrix.role }}/.output/.eve/compile/compiled-agent-manifest.json" \
            "services/${{ matrix.role }}/.output/.eve/compile/compiled-agent-manifest.json"
      # corepack first, as in console-image.yml: setup-node's `cache: pnpm` runs `pnpm store path`
      # and fails the job when pnpm is not on the PATH yet.
      - name: Enable corepack and prepare pnpm 9.15.0
        if: matrix.role != 'chief-of-staff'
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Setup Node 24 + pnpm
        if: matrix.role != 'chief-of-staff'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install the role's own dependency closure
        if: matrix.role != 'chief-of-staff'
        run: pnpm install --frozen-lockfile --filter "lares-${{ matrix.role }}..."
      - name: Run the agent-declaration conformance suite against the compiled manifest
        if: matrix.role != 'chief-of-staff'
        run: pnpm --filter "lares-${{ matrix.role }}" exec vitest run tests/agent-declaration.test.ts
      - name: Prove studio run ownership in the final creative image
        if: matrix.role == 'creative'
        run: python3 -B services/keeper/tests/studio-owner-image.probe.py lares-runtime:test
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.role }}/Dockerfile
          target: runtime
          push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}"
          tags: ghcr.io/heiberg-industries/lares-engine-${{ matrix.role }}-runtime:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Heiberg-Industries/lares
  keeper:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This changes only the disposable GitHub-hosted job daemon, before buildx or proof resources exist.
      - name: Prepare disposable hosted Docker image store
        run: |
          set -euo pipefail
          docker_override=false
          if [ -n "${DOCKER_HOST-}" ] || [ -n "${DOCKER_CONTEXT-}" ]; then docker_override=true; fi
          docker_config="${DOCKER_CONFIG:-$HOME/.docker}"
          sudo env "CI=${CI-}" "GITHUB_ACTIONS=${GITHUB_ACTIONS-}" "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT-}" \
            "GITHUB_SHA=$GITHUB_SHA" "LARES_DOCKER_OVERRIDE_PRESENT=$docker_override" \
            "DOCKER_CONFIG=$docker_config" "DOCKER_HOST=" "DOCKER_CONTEXT=" \
            python3 -B services/keeper/tests/outside-discovery-image.probe.py --prepare-image-store
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        id: keeper-image
        with: {context: ., file: services/keeper/Dockerfile, pull: true, load: true, tags: 'lares-keeper:test'}
      - uses: docker/build-push-action@v6
        id: squid-image
        with: {context: ., file: images/egress-proxy/Dockerfile, pull: true, load: true, tags: 'lares-squid:test'}
      - uses: docker/build-push-action@v6
        id: firewall-image
        with: {context: ., file: images/firewall-helper/Dockerfile, pull: true, load: true, tags: 'lares-nft:test'}
      - name: Scan final keeper image
        run: scripts/scan-image.sh lares-keeper:test "$RUNNER_TEMP/image-scans/keeper"
      - name: Scan final network helper images
        run: |
          scripts/scan-image.sh lares-squid:test "$RUNNER_TEMP/image-scans/egress"
          scripts/scan-image.sh lares-nft:test "$RUNNER_TEMP/image-scans/firewall"
      - name: Check bounded outside proof cleanup and safe failure evidence
        run: python3 -B services/keeper/tests/outside-discovery-image.probe.py --self-test
      - name: Prove configured outside discovery through the final Keeper and network helper images
        run: |
          proof="$RUNNER_TEMP/outside-discovery-proof.json"
          printf '{"format":1,"status":"not-started","cleanupOkay":false}\n' > "$proof"
          status=0
          sudo env "CI=${CI-}" "GITHUB_ACTIONS=${GITHUB_ACTIONS-}" "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT-}" "GITHUB_SHA=$GITHUB_SHA" python3 -B services/keeper/tests/outside-discovery-image.probe.py \
            "lares-keeper:test@${{ steps.keeper-image.outputs.digest }}" \
            "lares-squid:test@${{ steps.squid-image.outputs.digest }}" \
            "lares-nft:test@${{ steps.firewall-image.outputs.digest }}" \
            "$GITHUB_SHA" "$proof" || status=$?
          sudo chown "$(id -u):$(id -g)" "$proof" || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keeper-outside-discovery-proof
          path: ${{ runner.temp }}/outside-discovery-proof.json
          if-no-files-found: error
      - name: Prove fixed database roles in the final Keeper image
        if: always() && !cancelled() && steps.keeper-image.outcome == 'success'
        run: python3 -B services/keeper/tests/database-privileges-image.probe.py lares-keeper:test
      - name: Verify keeper runtime imports without starting sockets or migrations
        run: docker run --rm --network none --entrypoint /app/services/keeper/node_modules/.bin/tsx lares-keeper:test -e "import('/app/services/keeper/lib/lifecycle.ts').then(m => { if (!m.AgentLifecycle) process.exit(1) })"
      - name: Prove financial journal custody with the actual Linux kernel and final keeper image
        run: python3 services/keeper/tests/financial-journal-image.probe.py lares-keeper:test
      - name: Prove protected custody across PostgreSQL restart and restore
        run: python3 services/keeper/tests/financial-continuity-image.probe.py lares-keeper:test
      - name: Prove Vault reads through the final Keeper image and real managed Git files
        run: python3 services/keeper/tests/vault-files-image.probe.py lares-keeper:test
      - name: Prove root-only person erasure against the final Keeper image and Linux journal lock
        run: python3 services/keeper/tests/person-erasure-image.probe.py lares-keeper:test
      - name: Prove disposable maintenance admission and external database HBA
        run: |
          proof="$RUNNER_TEMP/maintenance-fence-proof.json"
          printf '{"format":1,"status":"not-started","cleanupOkay":false}\n' > "$proof"
          status=0
          sudo env CI=true python3 -B services/keeper/tests/maintenance-fence-image.probe.py lares-keeper:test "$GITHUB_SHA" "$proof" || status=$?
          sudo chown "$(id -u):$(id -g)" "$proof" || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keeper-maintenance-fence-proof
          path: ${{ runner.temp }}/maintenance-fence-proof.json
          if-no-files-found: error

      - name: Verify the box tooling loads and the engine unpacks
        run: |
          set -euo pipefail
          tsx=/app/services/box/node_modules/.bin/tsx
          docker run --rm --network none --entrypoint "$tsx" lares-keeper:test -e "import('/app/services/box/bin/render-stack.ts')"
          docker run --rm --network none --entrypoint "$tsx" lares-keeper:test -e "import('/app/services/box/migrate.ts')"
          docker run --rm --network none --entrypoint sh lares-keeper:test -c 'test -f /app/images/gateway-runtime/start.sh'
          rm -rf "$RUNNER_TEMP/engine-out"
          mkdir -p "$RUNNER_TEMP/engine-out"
          digest="example.invalid/engine@sha256:$(printf '%064d' 0)"
          docker run --rm --network none --user "$(id -u):$(id -g)" --mount "type=bind,src=$RUNNER_TEMP/engine-out,dst=/out" --entrypoint bash lares-keeper:test /app/services/box/ops/unpack-engine.sh ci-check "$digest"
          # The unpacked tree must hold exactly the repo's ops and sql files, both keeper compose
          # files, the creative workflow schema and the digest file, and nothing else.
          (
            cd services/box
            ls ops/* | sed 's#^#services/box/#'
            ls sql/* | sed 's#^#services/box/#'
            echo services/box/compose.lares-keeper.yaml
            echo services/box/compose.lares-keeper-vault.yaml
            echo services/box/engine-image
            echo services/creative/sql/001-eve-workflow.sql
          ) | LC_ALL=C sort > "$RUNNER_TEMP/engine-expected.txt"
          (cd "$RUNNER_TEMP/engine-out/ci-check" && find . -type f | sed 's#^\./##' | LC_ALL=C sort) > "$RUNNER_TEMP/engine-actual.txt"
          diff "$RUNNER_TEMP/engine-expected.txt" "$RUNNER_TEMP/engine-actual.txt"
          test "$(cat "$RUNNER_TEMP/engine-out/ci-check/services/box/engine-image")" = "$digest"
          installed_ops="$RUNNER_TEMP/engine-out/ci-check/services/box/ops"
          test -f "$installed_ops/maintenance-custody.py"
          python3 -c 'import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text())' "$installed_ops/maintenance-custody.py"
          for script in backup.sh backup-verify.sh restore-drill.sh setup-backups.sh refresh-recovery.sh; do
            grep -q 'maintenance-custody.py' "$installed_ops/$script"
          done
      - name: Prove unpacked maintenance admission in independent Linux systemd services
        run: python3 -B services/box/tests/maintenance-admission-systemd.probe.py "$RUNNER_TEMP/engine-out/ci-check/services/box/ops"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keeper-and-network-image-scans
          path: ${{ runner.temp }}/image-scans
          if-no-files-found: error
      - name: Verify keeper runtime Docker tools and Compose parser
        run: |
          docker run --rm --network none --entrypoint sh lares-keeper:test -c 'docker --version && docker compose version && ! command -v npm && ! command -v pnpm && ! command -v corepack'
          # Read-only negotiation with the disposable CI daemon, never an installation.
          docker run --rm --network none --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock --entrypoint docker lares-keeper:test version
          docker run --rm --network none --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock --entrypoint docker lares-keeper:test network inspect bridge --format '{{json .IPAM.Config}}'
          mkdir -p "$RUNNER_TEMP/keeper-compose"
          printf 'services:\n  example:\n    image: example.invalid/runtime@sha256:%064d\n' 0 > "$RUNNER_TEMP/keeper-compose/compose.yaml"
          docker run --rm --network none --mount "type=bind,src=$RUNNER_TEMP/keeper-compose,dst=/config,readonly" --entrypoint docker lares-keeper:test compose -f /config/compose.yaml config --quiet
      - name: Generate representative configs and validate with native target parsers
        run: |
          mkdir -p "$RUNNER_TEMP/lares-parser"
          docker run --rm --network none --mount "type=bind,src=$RUNNER_TEMP/lares-parser,dst=/output" --entrypoint /app/services/keeper/node_modules/.bin/tsx lares-keeper:test -e "import('/app/services/keeper/lib/egress.ts').then(({generateEgress})=>{const fs=require('node:fs');const e=generateEgress([{name:'example',address:'172.18.0.24',grants:[{capability:'notion',scope:'read'}],doors:[{kind:'slack',enabled:true}]}],{legacyConsumers:[{name:'sync',address:'172.18.0.10',hosts:['api.notion.com']}],internalNetworks:['172.18.0.0/16'],directDestinations:['192.0.2.1']});fs.writeFileSync('/output/squid.conf',e.squid);fs.writeFileSync('/output/rules.nft',e.nft)})"
          docker run --rm --network none --mount "type=bind,src=$RUNNER_TEMP/lares-parser,dst=/config,readonly" --entrypoint squid lares-squid:test -k parse -f /config/squid.conf
          docker run --rm --network none --cap-drop ALL --cap-add NET_ADMIN --mount "type=bind,src=$RUNNER_TEMP/lares-parser,dst=/config,readonly" lares-nft:test --check -f /config/rules.nft
      - name: Exercise final proxy policy and atomic reload on an isolated network
        run: |
          if sudo env GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" python3 services/keeper/tests/egress-image.probe.py lares-squid:test lares-keeper:test "$RUNNER_TEMP/proxy-proof.json"; then
            status=0
          else
            status=$?
          fi
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/proxy-proof.json"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-runtime-proof
          path: ${{ runner.temp }}/proxy-proof.json
          if-no-files-found: error
      - uses: docker/build-push-action@v6
        with: {context: ., file: services/keeper/Dockerfile, push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}", tags: 'ghcr.io/heiberg-industries/lares-engine-keeper:sha-${{ github.sha }}', labels: 'org.opencontainers.image.source=https://github.com/Heiberg-Industries/lares'}
      - uses: docker/build-push-action@v6
        with: {context: ., file: images/firewall-helper/Dockerfile, push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}", tags: 'ghcr.io/heiberg-industries/lares-engine-firewall-helper:sha-${{ github.sha }}', labels: 'org.opencontainers.image.source=https://github.com/Heiberg-Industries/lares'}
      - uses: docker/build-push-action@v6
        with: {context: ., file: images/egress-proxy/Dockerfile, push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}", tags: 'ghcr.io/heiberg-industries/lares-engine-egress-proxy:sha-${{ github.sha }}', labels: 'org.opencontainers.image.source=https://github.com/Heiberg-Industries/lares'}
