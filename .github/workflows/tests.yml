name: tests

# The net every other workflow is missing (LAR-60): every workspace package's own `test`
# script, run on every PR targeting main and every push to main — no path filter, on purpose, because the failure mode
# this closes is "a broken suite sits on main unnoticed until someone runs it by hand."
#
# Excluded, by name:
#   - packages/board-evals: has no `test` script (only `eval`, which drives LLM-graded
#     evals against a real model — no credential for that exists in CI).
#   - services/slack-relay, services/sync-jobs: no package.json — not pnpm workspace
#     members (Dockerfile/nginx-config only), so `pnpm -C <dir> test` has nothing to run.
#   - services/travel: hangs on this hosted runner — the worker's event loop is
#     genuinely CPU-bound (State R, wchan 0, empty kernel stack, CPU time climbing
#     continuously across two independent forked workers at once — proven via /proc
#     introspection, not a lock/child-process/stdin wait), never locally, and not yet
#     isolated to one file or line despite extensive bisection. Tracked in LAR-81 — it comes back into
#     the matrix when that is fixed; do not "fix" it by raising a timeout.
#
# Nothing here needs a live credential: every package below either has no external
# dependency (packages/compose-contract, junk, memory-evals, strength, taste,
# vault-format are pure, dependency-free) or spins up its own disposable Postgres via
# @testcontainers/postgresql — same pattern already exercised by the image-build
# workflows' runners. The hand-run live probes under tests/live/*.live.mts are never
# picked up here: every package's vitest include is either the default
# `**/*.{test,spec}.?(c|m)[jt]s?(x)` or an explicit `tests/**/*.test.ts`, and a `.live.mts`
# file matches neither.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs without cancelling main or manually dispatched runs.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Harmless on today's eve (0.60.1 after the mid-ticket upgrade); opts the agent-kit
  # `prepare` step's `eve extension build` invocation out of telemetry in CI.
  EVE_TELEMETRY_DISABLED: "1"
  # testcontainers' "Reaper" (Ryuk) is a helper container that cleans up after a crashed run.
  # On a hosted runner the whole machine is thrown away after the job, so it cleans up nothing
  # — but starting it fails at random ("Failed to connect to Reaper", keeper's first test file,
  # twice on 2026-09-20) and turns a run red in which every test passed. Off in CI only; a
  # developer's machine keeps it.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: agent-kit, dir: packages/agent-kit, timeout: 15 }
          - { name: compose-contract, dir: packages/compose-contract, timeout: 10 }
          - { name: junk, dir: packages/junk, timeout: 10 }
          - { name: memory-evals, dir: packages/memory-evals, timeout: 10 }
          - { name: strength, dir: packages/strength, timeout: 10 }
          - { name: taste, dir: packages/taste, timeout: 10 }
          - { name: vault-format, dir: packages/vault-format, timeout: 10 }
          - { name: atlas, dir: services/atlas, timeout: 10 }
          - { name: box, dir: services/box, timeout: 15 }
          - { name: chief-of-staff, dir: services/chief-of-staff, timeout: 15 }
          - { name: console, dir: services/console, timeout: 10 }
          - { name: creative, dir: services/creative, timeout: 10 }
          - { name: keeper, dir: services/keeper, timeout: 15 }
          - { name: network, dir: services/network, timeout: 10 }
          - { name: notion-sync, dir: services/notion-sync, timeout: 10 }
          - { name: readability, dir: services/readability, timeout: 10 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable corepack and prepare pnpm 9.15.0
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install age (services/box's backup tests shell out to the real age/age-keygen binaries)
        # services/box/tests/backup-lares.test.ts is the only test file in the whole
        # matrix that touches a real external binary outside git/bash/tar/docker/node
        # (all preinstalled on ubuntu-latest) — it generates a real age identity and
        # encrypts/decrypts with it. Everything else it and its neighbouring backup
        # tests (backup-verify, restore-drill) shell out to (restic, rclone, psql,
        # docker volume/compose) is a fake stand-in script placed on PATH by the test
        # itself; only `age`/`age-keygen` are genuinely exec'd.
        if: matrix.name == 'box'
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Install dependencies
        # Full workspace install, same as console-image.yml's typecheck job: several
        # packages' subpath exports point straight at another workspace package's source
        # (agent-kit's exports map), so a scoped install of just this package's own
        # closure is not enough for every consumer. The `canvas` optional dependency
        # (pulled in transitively by unpdf) fails its native build here for the same
        # reason it does locally — no pangocairo/pkg-config on the runner — and that
        # failure is harmless: pnpm treats it as an optional-dependency failure and the
        # install still exits 0.
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm -C ${{ matrix.dir }} test

  typecheck:
    name: workspace typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable corepack and prepare pnpm 9.15.0
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check every workspace package
        run: pnpm typecheck
      - name: Verify Prisma security override compatibility
        run: node scripts/check-prisma-config.mjs

  ci-passed:
    # Require this stable name in the main ruleset after this workflow is merged.
    # always() ensures failures/skips in dependencies cannot silently skip the gate.
    name: CI passed
    needs: [test, typecheck]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TEST_RESULT: ${{ needs.test.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
    steps:
      - name: Require successful tests and typecheck
        run: |
          test "$TEST_RESULT" = success
          test "$TYPECHECK_RESULT" = success
