name: sync-jobs image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/sync-jobs/**"
      # The closure the Dockerfile copies — a change to any of these changes the installed
      # image.
      - "services/notion-sync/**"
      - "services/atlas/**"
      - "services/box/**"
      # A digest-pin edit in compose.yaml is not a code change — it never touches anything
      # this image copies, so it must not retrigger a rebuild (ORB-178 final-review fix).
      - "!services/box/compose.yaml"
      - "services/network/**"
      - "packages/strength/**"
      - "packages/junk/**"
      - "patches/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "scripts/scan-image.sh"
      - ".github/workflows/sync-jobs-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact manually selected ref
        type: boolean
        default: false

concurrency:
  group: sync-jobs-image
  cancel-in-progress: false

jobs:
  build-push:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heiberg-industries/lares-sync-jobs
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      # Build context is the REPO ROOT, not services/sync-jobs: sync-jobs is a pnpm workspace
      # member with no lockfile of its own, so the install needs the root pnpm-workspace.yaml
      # and pnpm-lock.yaml. Same convention as eve-marcel's and eve-saga's image workflows.
      - name: Build final image for security evidence
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sync-jobs/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: lares-sync-jobs:test
          cache-from: type=gha
      - name: Scan final image
        run: scripts/scan-image.sh lares-sync-jobs:test "$RUNNER_TEMP/image-scans/sync-jobs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-jobs-image-scan
          path: ${{ runner.temp }}/image-scans
          if-no-files-found: error
      - name: Verify both scheduled-job entrypoints without providers
        run: |
          docker run --rm --network none --entrypoint sh lares-sync-jobs:test -c 'test "$(id -u)" = 10001 && ! command -v npm && ! command -v pnpm && ! command -v corepack'
          docker run --rm --network none -e NOTION_SYNC_LIVE=0 --entrypoint /app/node_modules/.bin/tsx lares-sync-jobs:test services/notion-sync/bin/notion-sync.ts
          # Atlas has no help mode: prove imports reach its argument guard, before
          # configuration, stores, credentials or any provider could be touched.
          if docker run --rm --network none --entrypoint /app/node_modules/.bin/tsx lares-sync-jobs:test services/atlas/bin/atlas-sync.ts --image-probe > "$RUNNER_TEMP/atlas-entrypoint.log" 2>&1; then
            echo 'Atlas should refuse the probe argument'; exit 1
          fi
          grep -F 'atlas: unknown argument "--image-probe"' "$RUNNER_TEMP/atlas-entrypoint.log"

      - name: Build and push (linux/amd64, digest-pinned)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sync-jobs/Dockerfile
          platforms: linux/amd64
          push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}"
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish digest to job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## sync-jobs image build"
            echo ''
            echo "Build digest (a build-only run does not publish it). Pin it on BOTH notion-sync and atlas-sync in services/box/compose.yaml:"
            echo '```'
            echo "ghcr.io/heiberg-industries/lares-sync-jobs@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
