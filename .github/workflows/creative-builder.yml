name: creative builder image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["scripts/scan-image.sh", "scripts/public-docs.ts", "services/creative/**", "packages/**", "patches/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "docs/**", ".github/workflows/creative-builder.yml", "images/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact manually selected ref
        type: boolean
        default: false
      docs_release:
        description: Public docs identity (candidate, or the exact release ID whose source is this ref)
        type: string
        default: candidate
permissions: { contents: read, packages: write }
env:
  EVE_TELEMETRY_DISABLED: "1"
  PUBLIC_DOCS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.docs_release || 'candidate' }}
jobs:
  build:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack and prepare pnpm 9.15.0
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install the public docs exporter
        run: pnpm install --frozen-lockfile --filter lares
      - name: Export and stage the verified public docs corpus
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export_dir="$RUNNER_TEMP/public-docs-corpus"
          node --import tsx scripts/public-docs.ts export --root "$GITHUB_WORKSPACE" --release "$PUBLIC_DOCS_RELEASE" --out "$export_dir" > "$RUNNER_TEMP/public-docs-identity.json"
          mkdir -p .public-docs-bake
          cp -R "$export_dir" .public-docs-bake/snapshot
          cp "$RUNNER_TEMP/public-docs-identity.json" .public-docs-bake/identity.json
          expected_hash="$(node -e 'const i=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if(i.sourceCommit!==process.argv[2]||i.release!==process.argv[3]) process.exit(1); process.stdout.write(i.corpusSha256)' "$RUNNER_TEMP/public-docs-identity.json" "$GITHUB_SHA" "$PUBLIC_DOCS_RELEASE")"
          node --import tsx scripts/public-docs.ts verify --snapshot "$GITHUB_WORKSPACE/.public-docs-bake/snapshot" --expected-corpus "$expected_hash"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heiberg-industries/lares-creative
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build final image for security evidence
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/creative/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: lares-creative-builder:test
      - name: Scan final image
        env:
          LARES_SCAN_BUILD_IMAGE: "1"
        run: scripts/scan-image.sh lares-creative-builder:test "$RUNNER_TEMP/image-scans/creative-builder"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-builder-image-scan
          path: ${{ runner.temp }}/image-scans
          if-no-files-found: error
      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/creative/Dockerfile
          push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}"
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
      - name: Publish digest to job summary
        run: |
          echo "## creative-builder image build" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Build digest (a build-only run does not publish it):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/heiberg-industries/lares-creative@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
