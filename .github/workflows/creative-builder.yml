name: creative builder image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["services/creative/**", "packages/**", "patches/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", ".github/workflows/creative-builder.yml", "images/**"]
  workflow_dispatch:
permissions: { contents: read, packages: write }
env:
  EVE_TELEMETRY_DISABLED: "1"
jobs:
  build:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heiberg-industries/lares-creative
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/creative/Dockerfile
          push: "${{ vars.PUBLISH_IMAGES == 'true' }}"
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
