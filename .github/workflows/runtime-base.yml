name: runtime base image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["scripts/scan-image.sh", "images/runtime-base/**", ".github/workflows/runtime-base.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact manually selected ref
        type: boolean
        default: false
permissions: { contents: read, packages: write }
jobs:
  build:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heiberg-industries/lares-runtime-base
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build final image for security evidence
        uses: docker/build-push-action@v6
        with:
          context: images/runtime-base
          platforms: linux/amd64
          pull: true
          load: true
          tags: lares-runtime-base:test
      - name: Scan final image
        run: scripts/scan-image.sh lares-runtime-base:test "$RUNNER_TEMP/image-scans/runtime-base"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-base-image-scan
          path: ${{ runner.temp }}/image-scans
          if-no-files-found: error
      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/runtime-base
          push: "${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PUBLISH_IMAGES == 'true') }}"
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
      - name: Publish digest to job summary
        run: |
          echo "## runtime-base image build" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Build digest (a build-only run does not publish it):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/heiberg-industries/lares-runtime-base@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
