name: console image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/console/**"
      - "packages/taste/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/console-image.yml"
      - "packages/agent-kit/**"
      - "packages/strength/**"
      - "services/box/**"
      - "services/network/**"
      - "images/**"
      - "patches/**"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: console-image
  cancel-in-progress: false

env:
  EVE_TELEMETRY_DISABLED: "1"
jobs:
  typecheck:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack and prepare pnpm 9.15.0
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # Full workspace install — console's typecheck follows the subpath import into
        # agent-kit's source, so `pg` types must resolve as they do locally.
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @lares/console typecheck

  build-push:
    if: ${{ vars.BUILD_IMAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heiberg-industries/lares-console
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push (linux/amd64, digest-pinned)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/console/Dockerfile
          platforms: linux/amd64
          push: "${{ vars.PUBLISH_IMAGES == 'true' }}"
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish digest to job summary
        run: |
          echo "## console image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in compose.yaml:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/heiberg-industries/lares-console@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
