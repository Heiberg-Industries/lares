acl SSL_ports port 443
acl CONNECT method CONNECT
acl agent_slack dstdomain .slack.com .slack-files.com   # : files.slack.com 302s downloads (PDFs) here
acl agent_google dstdomain .googleapis.com   # Gmail/Calendar — rotating IPs like Slack, so allow by domain
acl atlas_sources dstdomain api.github.com api.notion.com
acl eve_telemetry dstdomain cloud.langfuse.com
acl agent_telegram dstdomain api.telegram.org
acl extra_hosts dstdomain api.service-a.example api.service-b.example maps.service-c.example data.service-d.example
acl fleet_transit dstdomain api.entur.io
http_access allow CONNECT agent_slack SSL_ports
http_access allow CONNECT agent_google SSL_ports
http_access allow CONNECT atlas_sources SSL_ports
http_access allow CONNECT eve_telemetry SSL_ports
http_access allow CONNECT agent_telegram SSL_ports
http_access allow CONNECT extra_hosts SSL_ports
http_access allow CONNECT fleet_transit SSL_ports
http_access deny all
http_port 8888
cache deny all
