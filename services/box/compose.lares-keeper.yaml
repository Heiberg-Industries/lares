# The keeper's own compose file. ops/install.sh's run_keeper copies it to this
# installation's opt directory and brings it up there, after the owner exists, with every
# variable below supplied through a rendered --env-file: the two image digests come from the
# release the install was given, the eight paths from the installation itself.
#
# Every variable below carries a `:?` check, which refuses loudly, before anything starts, a
# compose-up with variables nobody has set. The installer sets every one of them from data it
# holds, so nothing has to be set by hand.
#
# Docker bind sources refer to HOST paths. Mount keeper-owned roots at the SAME absolute path.
# EVERY PATH keeper.json NAMES MUST BE UNDER ONE OF THESE MOUNTS (except the keeper's own
# /app/… image paths): the keeper reads that configuration from inside this container, so a
# path no mount covers is a file it cannot open. services/box/tests/install-keeper.test.ts
# derives both sides — the mounts from this file, the paths from a rendered keeper.json — and
# fails if the two ever stop agreeing.
services:
  lares-keeper:
    image: ${LARES_KEEPER_IMAGE:?full digest required}
    read_only: true
    user: '0:0'
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: [/app/services/keeper/node_modules/.bin/tsx, /app/services/keeper/bin/keeper.ts, serve]
    volumes:
      # Dedicated host-only state namespace: never under ordinary /etc or /srv backups.
      # The custody child is created ONLY by the explicit fresh-install ceremony.
      - /var/lib/lares:/var/lib/lares
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LARES_ROOT:?absolute keeper-owned root}:${LARES_ROOT:?absolute keeper-owned root}
      - ${LARES_KEEPER_CONFIG:?absolute config file}:/etc/lares/keeper.json:ro
      # Exact read-only credential files only. The privileged PostgreSQL operator file is in a
      # separate host directory and is never included here or passed through keeper.json.
      - ${LARES_DATABASE_PASSWORD_FILE:?app database password file required}:${LARES_DATABASE_PASSWORD_FILE:?app database password file required}:ro
      - ${LARES_FINANCIAL_DATABASE_PASSWORD_FILE:?financial database password file required}:${LARES_FINANCIAL_DATABASE_PASSWORD_FILE:?financial database password file required}:ro
      - ${LARES_WORKFLOW_PROVISIONER_PASSWORD_FILE:?workflow provisioner password file required}:${LARES_WORKFLOW_PROVISIONER_PASSWORD_FILE:?workflow provisioner password file required}:ro
      - ${LARES_WORKFLOW_RUNTIME_PASSWORD_FILE:?workflow runtime password file required}:${LARES_WORKFLOW_RUNTIME_PASSWORD_FILE:?workflow runtime password file required}:ro
      - ${LARES_GATEWAY_MASTER_KEY_FILE:?gateway master key file required}:${LARES_GATEWAY_MASTER_KEY_FILE:?gateway master key file required}:ro
      - ${LARES_EVE_ROUTE_PASSWORD_FILE:?route password file required}:${LARES_EVE_ROUTE_PASSWORD_FILE:?route password file required}:ro
      - ${LARES_VAULT_SIGNING_KEY_FILE:?Vault signing key file required}:${LARES_VAULT_SIGNING_KEY_FILE:?Vault signing key file required}:ro
      - ${LARES_SOCKET_DIR:?absolute app socket directory}:/run/lares
      - ${LARES_HOST_SOCKET_DIR:?absolute host socket directory}:/run/lares-host
    tmpfs: [/tmp]
    networks: [lares-network]
  lares-egress-proxy:
    image: ${LARES_SQUID_IMAGE:?full digest required}
    container_name: lares-egress-proxy
    # Squid refuses reload when its PID file names PID 1; keep it behind Docker init.
    init: true
    restart: unless-stopped
    # Directory mount is mandatory: atomic config replacement must change the inode seen by Squid.
    volumes:
      - ${LARES_EGRESS_DIR:?absolute egress directory}:/config:ro
    command: [squid, -N, -f, /config/squid.conf]
    networks:
      lares-network:
        ipv4_address: ${LARES_PROXY_ADDRESS:?reserved proxy address}
networks:
  lares-network:
    external: true
    name: ${LARES_NETWORK:?existing network}
