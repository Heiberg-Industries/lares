# Saga egress proxy (squid) — domain allow-list for Slack ONLY.
#
# Why: Slack's Socket Mode + Web API live on rotating AWS IPs, so an IP firewall can't
# allow them reliably. This proxy allow-lists by DOMAIN (immune to IP churn). Saga's
# Slack client (SAGA_SLACK_PROXY=http://slack-proxy:8888) sends every Slack CONNECT here.
# gateway.example.com + crm.owner.example are one stable IP (192.0.2.10) and go
# DIRECT — they never traverse this proxy.
#
# Deployed at /opt/agent-box/proxy/squid.conf on the box; run foreground via
#   squid -N -d1 -f /etc/squid/squid.conf
# Reached only on the internal Docker network (no published port).

acl SSL_ports port 443
acl CONNECT method CONNECT

# The ONLY destinations Saga may tunnel to (Socket Mode wss-*.slack.com, api.slack.com).
acl saga_slack dstdomain .slack.com
acl saga_google dstdomain .googleapis.com   # Gmail/Calendar — rotating IPs like Slack, so allow by domain

# The Atlas sync job's canonical sources: repo docs from GitHub, venture playbooks from
# Notion. Both rotate IPs, so they are allow-listed by DOMAIN here rather than by address —
# the same reason Slack and Google are. Exact hostnames, not a `.github.com` suffix: the job
# only ever calls the contents API, and a suffix would also open codeload, raw, and every
# other subdomain the token can reach.
acl atlas_sources dstdomain api.github.com api.notion.com

# eve-saga's OpenTelemetry export. Exact host, not `.langfuse.com`: the shadow only ever
# POSTs spans to the EU ingest endpoint, and a suffix would open every Langfuse subdomain
# to a container whose entire reason for being sealed is that it reads untrusted content.
acl eve_telemetry dstdomain cloud.langfuse.com

# eve-saga's Telegram door (Task 14, code-only slice). Exact host, matching the Langfuse
# precedent above — not a `.telegram.org` suffix, which would open every Telegram
# subdomain to a sealed container. `lib/telegram-fetch.ts` routes every Bot API call here
# via eve's per-call fetch seam, the same convergence point as Slack's.
acl saga_telegram dstdomain api.telegram.org

# eve-marcel's travel/place APIs (eve-Marcel wave, Task 1). Old Marcel (172.18.0.22) is
# unsealed today and reaches these directly; eve-marcel (172.18.0.25) is sealed from day
# one, so every external domain it needs is allow-listed by DOMAIN here (all rotate IPs
# like Slack/Google, so an nft IP allow can't hold them). Exact hosts, not suffixes — same
# discipline as saga_telegram/eve_telemetry above. places.googleapis.com and
# maps.googleapis.com are ALSO covered by the broader saga_google (.googleapis.com)
# wildcard above; listed here too so this block is Marcel's own complete, self-contained
# contract, independent of whether that wildcard narrows later. api.telegram.org
# (Marcel's own bot, distinct token from Saga's) reuses the saga_telegram acl above — no
# new entry needed, since squid's allow-list is destination-scoped, not source-scoped.
# The gateway (192.0.2.10) and Postgres (db, internal Docker network) are direct IP
# allows in ops/egress-saga.nft and never traverse this proxy.
acl marcel_travel dstdomain places.googleapis.com maps.googleapis.com nominatim.openstreetmap.org overpass-api.de valhalla1.openstreetmap.de api.met.no marine-api.open-meteo.com www.strava.com asrv.avinor.no aerodatabox.p.rapidapi.com api.frankfurter.dev

# Entur — Norway's national journey planner (ORB-168). FLEET-level, not one agent's: both
# eve-saga (172.18.0.24) and eve-marcel (172.18.0.25) call it, which is why it is its own acl
# rather than an entry appended to marcel_travel. Squid's allow-list is destination-scoped, not
# source-scoped, so one entry serves both — the same reasoning that let Marcel reuse
# saga_telegram above.
#
# By DOMAIN, not by an nft IP allow, and that is the whole point: api.entur.io resolves to
# 34.117.190.21 / 34.149.162.204 — Google Cloud load-balancer anycast VIPs that can be
# reassigned. This is exactly the rotating case this proxy exists for. nft needs NO change:
# ops/egress-saga.nft already permits the proxy hop with `ip daddr 172.18.0.0/16 accept`.
#
# Exact host, not a `.entur.io` suffix — same discipline as saga_telegram/eve_telemetry. No API
# key exists; Entur identifies callers by an `ET-Client-Name` header instead.
#
# Reaching it needs the explicit proxy fetch (@lares/agent-kit/telegram-fetch), because Node's
# built-in fetch ignores proxy env vars. A missing allow here surfaces as EnturUnavailableError
# — "cannot reach Entur" — never as "there are no trains".
acl fleet_transit dstdomain api.entur.io

# Tyche's market feed, folded into eve-saga as the market_edge skill (ORB-189). Read-only public
# APIs, no auth — Kalshi's catalog, Polymarket's Gamma catalog, and Polymarket's CLOB price
# endpoint. Exact hosts, not suffixes — same discipline as saga_telegram/eve_telemetry above.
acl fleet_markets dstdomain api.elections.kalshi.com clob.polymarket.com gamma-api.polymarket.com

# Allow CONNECT tunnels to *.slack.com:443 only; deny everything else (default-deny).
http_access allow CONNECT saga_slack SSL_ports
http_access allow CONNECT saga_google SSL_ports
http_access allow CONNECT atlas_sources SSL_ports
http_access allow CONNECT eve_telemetry SSL_ports
http_access allow CONNECT saga_telegram SSL_ports
http_access allow CONNECT marcel_travel SSL_ports
http_access allow CONNECT fleet_transit SSL_ports
http_access allow CONNECT fleet_markets SSL_ports
http_access deny all

http_port 8888
cache deny all
# Access log stays at the default /var/log/squid/access.log (read via
# `docker exec slack-proxy cat /var/log/squid/access.log`). squid's `proxy` user can't
# open /dev/stdout in this image, so stdout logging is intentionally not used.
