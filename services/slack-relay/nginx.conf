# EXAMPLE ONLY: replace reserved domains and documentation IPs in a private installation config.
# Mount it at /run/lares/relay.conf; this file is not the running configuration.
# services/slack-relay/nginx.conf
#
# The dumb pipe of ADR-0011: public ingress terminates here on ops-1, and exactly one path
# per door is forwarded over the tailnet to the eve app that owns it on agent-1. Everything
# else 404s.
#
# What this file deliberately does NOT do:
#   - verify Slack/Telegram signatures (the signing secrets live on agent-1, with the service
#     that checks them; splitting either across two boxes doubles the rotation surface)
#   - rewrite, buffer-mangle or re-encode the body (Slack's HMAC covers the RAW bytes, so
#     any modification here would break verification on the other side)
#   - forward any other eve route — /eve/v1/session and /.well-known/workflow are for the
#     tailnet only and must never be publicly reachable
#
# ONE HOSTNAME PER DOOR — FOUR OF THEM TODAY (Task 14 built the first two; ORB-135 added the
# fourth): Traefik/Coolify does TLS termination upstream and forwards to this container by
# Host header, so each door gets its OWN `server_name` block rather than a shared catch-all
# with several locations. This is the hard requirement, not a style choice, and it now carries
# weight in two directions:
#
#   ACROSS PROTOCOLS — the Slack hostname must NOT forward the Telegram path, and vice versa.
#   A request for /eve/v1/telegram on slack.example.com (or /eve/v1/slack on
#   telegram.example.com) must 404, the same as any other unrecognised path.
#
#   ACROSS AGENTS — eve mounts each channel's webhook at the SAME fixed path on every eve app,
#   so eve-saga's and eve-calliope's Slack traffic (and eve-saga's and eve-marcel's Telegram
#   traffic) are indistinguishable apart from the Host header. The hostname is the ONLY thing
#   that can tell them apart here; the per-agent path prefix in each `proxy_pass` is what
#   carries the distinction onward past this relay.
#
# Four named `server_name` blocks plus an explicit `default_server` fallback (below) is what
# enforces that; nginx would otherwise silently let the first-defined server become the
# implicit default for any unmatched Host header, which is not a decision this file makes
# implicitly.

worker_processes 1;
error_log /dev/stderr warn;

# Runtime scratch lives in one directory owned by the unprivileged runtime user, NOT in
# /tmp. /tmp is world-writable but sticky, so a root-owned file left there — by, say, a
# build-time `nginx -t` — can never be replaced by the runtime user, and the container
# dies at boot with a bare "permission denied".
pid /var/lib/nginx-relay/nginx.pid;

events { worker_connections 256; }

http {
  access_log /dev/stdout;

  client_body_temp_path /var/lib/nginx-relay/client_body;
  proxy_temp_path       /var/lib/nginx-relay/proxy;
  fastcgi_temp_path     /var/lib/nginx-relay/fastcgi;
  uwsgi_temp_path       /var/lib/nginx-relay/uwsgi;
  scgi_temp_path        /var/lib/nginx-relay/scgi;

  server_tokens off;

  # agent-1 over the tailnet, addressed by its STABLE tailscale IP rather than its MagicDNS
  # name: no name resolution in the request path, so the relay cannot fail on DNS. TLS is
  # still verified against the real hostname via SNI below — the tailnet is already
  # WireGuard-encrypted, and this keeps the certificate check honest on top of it. Shared by
  # both doors below — same box, same eve-saga process, different route per door.
  upstream eve_saga {
    server 192.0.2.10:443;
    keepalive 8;
  }

  # Same box, same tailnet endpoint — eve-marcel (172.18.0.25) sits behind the SAME single
  # tailscale-serve HTTPS listener as eve-saga (there is exactly one tailnet identity per
  # node, agent.example.internal, so a distinct upstream name here is purely a
  # readability convenience, not a distinct connection target).
  upstream eve_marcel {
    server 192.0.2.10:443;
    keepalive 8;
  }

  # Same box, same tailnet endpoint again — eve-calliope sits behind the SAME single
  # tailscale-serve HTTPS listener as the other two. Named separately for readability only;
  # what actually distinguishes her container is the /eve-calliope path prefix in the
  # proxy_pass below, not this upstream.
  upstream eve_calliope {
    server 192.0.2.10:443;
    keepalive 8;
  }

  # ── Slack door ────────────────────────────────────────────────────────────────────────
  server {
    listen 8080;
    server_name slack.example.com;

    # Slack's 3s ack budget. Generous enough for the tailnet hop, short enough that a dead
    # box surfaces as an error rather than a hung worker.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # THE one forwarded route on this hostname. `location =` is an exact match, not a
    # prefix: /eve/v1/slack forwards, /eve/v1/slackfoo and /eve/v1/slack/anything do not —
    # and neither does /eve/v1/telegram, which has no location block here at all.
    location = /eve/v1/slack {
      proxy_pass https://eve_saga/eve/v1/slack;
      proxy_http_version 1.1;

      # Verify agent-1's Let's Encrypt cert against its real name while connecting by IP.
      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      # tailscale serve routes on Host, so it must be the ts.net name, not ours.
      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Pass the body through untouched — Slack signs the raw bytes.
      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    # Everything else, including /eve/v1/telegram, /eve/v1/health, /eve/v1/session and
    # /.well-known/workflow. A 200 on any of these through the relay is a scoping FAILURE,
    # not a convenience.
    location / {
      return 404;
    }
  }

  # ── Telegram door ─────────────────────────────────────────────────────────────────────
  server {
    listen 8080;
    server_name telegram.example.com;

    # Same ack-budget reasoning as the Slack block above — Telegram's webhook timeout is
    # more forgiving than Slack's 3s, but there is no reason to run this door's proxy on a
    # looser timeout than the other, so it is copied verbatim rather than re-derived.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # THE one forwarded route on this hostname — mirrors the Slack block's location exactly,
    # for /eve/v1/telegram instead. /eve/v1/slack has no location block here at all: a
    # request for it on this hostname falls through to the catch-all below and 404s, the
    # same as any other unrecognised path.
    location = /eve/v1/telegram {
      proxy_pass https://eve_saga/eve/v1/telegram;
      proxy_http_version 1.1;

      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Pass the body through untouched — same reasoning as Slack: eve's Telegram channel
      # verifies its own webhook secret token over the raw request, so nothing here may
      # rewrite, buffer-mangle, or re-encode it either.
      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    # Everything else, including /eve/v1/slack, /eve/v1/health, /eve/v1/session and
    # /.well-known/workflow. Same scoping-failure-not-convenience posture as the Slack block.
    location / {
      return 404;
    }
  }

  # ── Marcel Telegram door (eve-marcel) ─────────────────────────────────────────────────
  # eve's built-in Telegram channel mounts its webhook at the SAME fixed path on every eve
  # app — /eve/v1/telegram is not configurable (confirmed against the bundled channel docs;
  # unlike a custom channel, the built-in one declares no route-override option). So Telegram
  # webhooks for eve-saga and eve-marcel arrive at this relay on an IDENTICAL path, and the
  # only thing that can tell them apart is which server_name (hostname) they came in on —
  # exactly why this door gets its own dedicated DNS name (ADR-0011), not a shared one with
  # eve-saga's telegram.example.com.
  #
  # The disambiguation has to survive past this relay too: agent-1's tailscale-serve config
  # has exactly ONE HTTPS listener (one tailnet identity, agent.example.internal —
  # a second public hostname cannot get its own TLS cert from Tailscale on the same node), so
  # by the time a request reaches agent-1 there is no Host header left to route on — this
  # relay already rewrote it to the tailnet name for both doors. tailscale-serve's own
  # dispatch is PATH-prefix based instead (see its existing /eve vs /.well-known/workflow
  # split, both landing on eve-saga's 172.18.0.24 today) — so this block borrows that same
  # mechanism: it forwards Telegram's request to a MARCEL-SPECIFIC path prefix
  # (/eve-marcel/v1/telegram, not /eve/v1/telegram) purely so agent-1 can tell it apart from
  # eve-saga's identical-looking traffic. `proxy_pass`'s URI component below does the rewrite;
  # the box-side change (adding the /eve-marcel -> 172.18.0.25:3000/eve tailscale-serve
  # handler) is a separate, imperative step — `tailscale serve` config lives on the box, not
  # in this repo, same as every other agent box operational setting.
  server {
    listen 8080;
    server_name marcel-telegram.example.com;

    # Same ack-budget reasoning as the other two doors' blocks — copied verbatim rather than
    # re-derived.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # Telegram calls this relay at the conventional /eve/v1/telegram path (that's the URL
    # registered with setWebhook — Task 12), but the onward proxy_pass target below rewrites
    # it to /eve-marcel/v1/telegram so agent-1's tailscale-serve can dispatch it to
    # eve-marcel's container instead of eve-saga's, per the header comment above.
    location = /eve/v1/telegram {
      proxy_pass https://eve_marcel/eve-marcel/v1/telegram;
      proxy_http_version 1.1;

      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Pass the body through untouched — same reasoning as the other doors: eve's Telegram
      # channel verifies its own webhook secret token over the raw request.
      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    location / {
      return 404;
    }
  }

  # ── Calliope's Slack door (eve-calliope, ORB-135) ────────────────────────────────────
  # A DEDICATED server_name, never another `location` on the slack.example.com block.
  # See this file's header: Traefik forwards to this container by Host, and eve mounts its
  # Slack webhook at the same fixed /eve/v1/slack path on every eve app — so eve-saga's and
  # eve-calliope's inbound traffic is byte-identical apart from the Host header, and the
  # hostname is the ONLY thing that can tell them apart here.
  #
  # Past this relay there is no Host header left to route on either (both doors rewrite it to
  # the tailnet name below, because agent-1 has exactly one tailnet identity and therefore one
  # TLS cert). tailscale-serve dispatches on PATH prefix instead, so this block borrows the
  # same mechanism eve-marcel's does: it forwards to a CALLIOPE-SPECIFIC prefix,
  # /eve-calliope/v1/slack, purely so agent-1 can hand it to her container rather than
  # eve-saga's. `proxy_pass`'s URI component does that rewrite. The matching box-side handler
  # (/eve-calliope -> 172.18.0.x:3000/eve) is an imperative `tailscale serve` step on agent-1,
  # NOT in this repo — Task 7. These two must agree exactly or the door 404s.
  server {
    listen 8080;
    server_name calliope.example.com;

    # Same ack-budget reasoning as the three doors above — copied verbatim rather than
    # re-derived. Slack's 3s ack budget is the binding constraint.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # THE one forwarded route on this hostname. `location =` is an exact match, not a prefix.
    # Slack sends BOTH events and interactivity here — eve branches on Content-Type inside the
    # channel, so interactivity needs no route of its own.
    location = /eve/v1/slack {
      proxy_pass https://eve_calliope/eve-calliope/v1/slack;
      proxy_http_version 1.1;

      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Pass the body through untouched — Slack's HMAC covers the RAW bytes, and it is
      # verified in her container (agent/channels/slack.ts), not here.
      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    # Everything else, including /eve/v1/telegram, /eve/v1/health, /eve/v1/session and
    # /.well-known/workflow. Same scoping-failure-not-convenience posture as the other doors.
    location / {
      return 404;
    }
  }

  # ── Fallback: any other Host header ──────────────────────────────────────────────────
  # nginx picks the FIRST server block as the implicit default for any Host header that
  # matches no `server_name` — silently, with no error — unless a block is marked
  # `default_server` explicitly. Without this, an unexpected Host (a bare IP hit, a
  # misconfigured DNS entry, a scanner) would fall through to whichever door happens to be
  # defined first above and get that door's `location /` 404, which is accidentally correct
  # today but not a guarantee this file makes on purpose. This block makes the "any other
  # Host header 404s" behavior an explicit, inert catch-all instead.
  server {
    listen 8080 default_server;
    server_name _;
    return 404;
  }
}
