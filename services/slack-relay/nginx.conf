# EXAMPLE ONLY: replace reserved domains and documentation IPs in a private installation config.
# Mount it at /run/lares/relay.conf; this file is not the running configuration.
# services/slack-relay/nginx.conf
#
# The dumb pipe of ADR-0011: public ingress terminates here, and exactly one path per door is
# forwarded over the tailnet to the agent that owns it on the agent host. Everything else 404s.
#
# What this file deliberately does NOT do:
# - verify Slack/Telegram signatures (the signing secrets live on the agent host, with the
# service that checks them; splitting either across two machines doubles the rotation surface)
# - rewrite, buffer-mangle or re-encode the body (Slack's HMAC covers the RAW bytes, so
# any modification here would break verification on the other side)
# - forward any other eve route: /eve/v1/session and /.well-known/workflow are for the
# tailnet only and must never be publicly reachable
#
# THE PATTERN: ONE SERVER BLOCK PER DOOR, PER AGENT.
# A door is one channel (Slack or Telegram) of one agent. Each door gets its own `server_name`
# (a hostname), and each block is the same shape:
# server { listen 8080; server_name <door-host>; timeouts; location = /eve/v1/<channel>
# { proxy_pass https://eve_host/<prefix>/eve/v1/<channel>; ... } location / { return 404; } }
# The primary agent has no path prefix. Every other agent takes a prefix, named after the agent,
# and gets its own blocks. To add an agent, copy the two blocks for a second agent, rename the
# hostnames and the prefix, and add the matching path prefix on the agent host.
#
# WHY A HOSTNAME PER DOOR. Traefik/Coolify does TLS termination upstream and forwards to this
# container by Host header. eve mounts each channel's webhook at the SAME fixed path on every eve
# app, so two agents' Slack traffic (and two agents' Telegram traffic) are indistinguishable apart
# from the Host header. The hostname is the only thing that can tell them apart here. Past this
# relay the agent host has exactly one tailnet identity, so the Host header is rewritten to the
# tailnet name and the path prefix carries the distinction onward instead.
#
# ACROSS PROTOCOLS: the Slack hostname must NOT forward the Telegram path, and vice versa. A request
# for /eve/v1/telegram on the Slack hostname must 404, the same as any other unrecognised path.
#
# Explicit `default_server` fallback (below): nginx would otherwise silently let the first-defined
# server become the implicit default for any unmatched Host header. This file makes that decision
# on purpose.

worker_processes 1;
error_log /dev/stderr warn;

# Runtime scratch lives in one directory owned by the unprivileged runtime user, NOT in
# /tmp. /tmp is world-writable but sticky, so a root-owned file left there (by, say, a
# build-time `nginx -t`) can never be replaced by the runtime user, and the container
# dies at boot with a bare "permission denied".
pid /var/lib/nginx-relay/nginx.pid;

events { worker_connections 256; }

http {
  access_log /dev/stdout;

  client_body_temp_path /var/lib/nginx-relay/client_body;
  proxy_temp_path       /var/lib/nginx-relay/proxy;
  fastcgi_temp_path     /var/lib/nginx-relay/fastcgi;
  uwsgi_temp_path       /var/lib/nginx-relay/uwsgi;
  scgi_temp_path        /var/lib/nginx-relay/scgi;

  server_tokens off;

  # The agent host, addressed by its STABLE tailscale IP rather than its MagicDNS name: no name
  # resolution in the request path, so the relay cannot fail on DNS. TLS is still verified against
  # the real hostname via SNI below. The tailnet is already WireGuard-encrypted, and this keeps the
  # certificate check honest on top of it. Every agent on that host shares this one upstream.
  upstream eve_host {
    server 192.0.2.10:443;
    keepalive 8;
  }

  # ── Primary agent, Slack door ─────────────────────────────────────────────────────────
  server {
    listen 8080;
    server_name slack.example.com;

    # Slack's 3s ack budget. Generous enough for the tailnet hop, short enough that a dead
    # host surfaces as an error rather than a hung worker.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # THE one forwarded route on this hostname. `location =` is an exact match, not a
    # prefix: /eve/v1/slack forwards, /eve/v1/slackfoo and /eve/v1/slack/anything do not.
    location = /eve/v1/slack {
      proxy_pass https://eve_host/eve/v1/slack;
      proxy_http_version 1.1;

      # Verify the host's certificate against its real name while connecting by IP.
      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      # tailscale serve routes on Host, so it must be the ts.net name, not ours.
      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Pass the body through untouched. Slack signs the raw bytes.
      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    # Everything else, including /eve/v1/telegram, /eve/v1/health, /eve/v1/session and
    # /.well-known/workflow. A 200 on any of these through the relay is a scoping FAILURE,
    # not a convenience.
    location / {
      return 404;
    }
  }

  # ── Primary agent, Telegram door ──────────────────────────────────────────────────────
  server {
    listen 8080;
    server_name telegram.example.com;

    # Same ack-budget timeouts as the Slack door, copied verbatim.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # THE one forwarded route on this hostname, mirroring the Slack door for /eve/v1/telegram.
    location = /eve/v1/telegram {
      proxy_pass https://eve_host/eve/v1/telegram;
      proxy_http_version 1.1;

      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Pass the body through untouched. eve's Telegram channel verifies its own webhook
      # secret token over the raw request, so nothing here may rewrite it.
      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    location / {
      return 404;
    }
  }

  # ── Second agent, Telegram door (example: "agent-two") ────────────────────────────────
  # eve's built-in Telegram channel mounts its webhook at the SAME fixed path on every eve app,
  # so this door's Telegram webhook arrives on the same /eve/v1/telegram path as the primary's.
  # Its own hostname is what tells the two apart. This block then rewrites the onward path to the
  # agent's prefix, /agent-two/v1/telegram, so the agent host can dispatch it to the right
  # container. The matching path prefix on the agent host is a separate, host-side step; it is not
  # configured in this repo.
  server {
    listen 8080;
    server_name agent-two-telegram.example.com;

    # Same ack-budget timeouts as the other doors, copied verbatim.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # Telegram calls this relay at the conventional /eve/v1/telegram path (the URL registered
    # with setWebhook). The proxy_pass below rewrites it to the agent's prefix.
    location = /eve/v1/telegram {
      proxy_pass https://eve_host/agent-two/v1/telegram;
      proxy_http_version 1.1;

      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    location / {
      return 404;
    }
  }

  # ── Second agent, Slack door (example: "agent-two") ───────────────────────────────────
  # A DEDICATED server_name, never another `location` on the primary's Slack hostname. eve mounts
  # its Slack webhook at the same fixed /eve/v1/slack path on every eve app, so the hostname is the
  # only thing that tells two agents' Slack traffic apart at this relay. Past the relay the request
  # is handed to the agent host on its own prefix, /agent-two/v1/slack. That is the same mechanism
  # as the Telegram door above.
  server {
    listen 8080;
    server_name agent-two-slack.example.com;

    # Slack's 3s ack budget is the binding constraint. Same timeouts as the other doors.
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # THE one forwarded route on this hostname. Slack sends BOTH events and interactivity here;
    # the channel branches on Content-Type, so interactivity needs no route of its own.
    location = /eve/v1/slack {
      proxy_pass https://eve_host/agent-two/v1/slack;
      proxy_http_version 1.1;

      proxy_ssl_server_name on;
      proxy_ssl_name        agent.example.internal;
      proxy_ssl_verify      on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_set_header Host              agent.example.internal;
      proxy_set_header Connection        "";
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Pass the body through untouched. Slack's HMAC covers the RAW bytes, and it is verified
      # in the agent's container, not here.
      proxy_request_buffering on;
      client_max_body_size 1m;
    }

    # Everything else, including /eve/v1/telegram, /eve/v1/health, /eve/v1/session and
    # /.well-known/workflow. Same scoping-failure-not-convenience posture as the other doors.
    location / {
      return 404;
    }
  }

  # ── Fallback: any other Host header ───────────────────────────────────────────────────
  # nginx picks the FIRST server block as the implicit default for any Host header that
  # matches no `server_name`, silently, unless a block is marked `default_server` explicitly.
  # This block makes "any other Host header 404s" an explicit, inert catch-all instead.
  server {
    listen 8080 default_server;
    server_name _;
    return 404;
  }
}
